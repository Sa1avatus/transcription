server {
    listen 8080;
    server_name _;

    # The public Quick Tunnel exposes only the Mini App shell and its
    # authenticated statistics endpoint; operational API routes stay private.
    location = /miniapp {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/miniapp/stats {
        limit_except POST { deny all; }
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { return 404; }
}
