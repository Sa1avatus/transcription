<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transcription Service</title>
  <style>
    :root{color-scheme:dark;--card:#152033;--muted:#94a3b8;--accent:#38bdf8;--ok:#34d399;--err:#fb7185;--border:#26354d;--input:#0d1829}
    *{box-sizing:border-box} body{margin:0;background:#0b1220;color:#e5e7eb;font:15px system-ui,sans-serif}
    main{max-width:1100px;margin:0 auto;padding:48px 24px} h1{margin:0;font-size:32px} p{color:var(--muted)}
    .nav{display:flex;gap:16px;margin:16px 0 24px}
    .nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:6px;font-size:13px}
    .nav a:hover{color:var(--accent);background:rgba(56,189,248,.1)}
    .nav a.active{color:var(--accent);background:rgba(56,189,248,.15)}
    .summary{display:flex;gap:16px;flex-wrap:wrap;margin:28px 0}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;min-width:150px}
    .value{display:block;font-size:28px;font-weight:700;color:var(--accent)}
    table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
    th,td{text-align:left;padding:14px;border-bottom:1px solid var(--border)}th{color:var(--muted);font-weight:600}
    .status{font-weight:700}.done{color:var(--ok)}.error{color:var(--err)}.processing{color:var(--accent)}.pending{color:#fbbf24}
    code{font-size:12px}
    button,.btn{background:var(--accent);border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer;color:#0b1220}
    button:hover,.btn:hover{background:#7dd3fc}
    .btn-sm{padding:5px 10px;font-size:12px;border-radius:5px}
    .btn-danger{background:var(--err);color:#fff} .btn-danger:hover{background:#f43f5e}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)} .btn-outline:hover{border-color:var(--accent);color:var(--accent)}
    .btn-bar{display:flex;gap:8px;margin:16px 0}

    /* Upload zone */
    .upload-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:28px}
    .upload-section h2{margin:0 0 16px;font-size:18px;color:var(--accent)}
    .upload-zone{border:2px dashed var(--border);border-radius:12px;padding:40px 24px;text-align:center;cursor:pointer;transition:all .2s}
    .upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:rgba(56,189,248,.05)}
    .upload-zone .icon{font-size:48px;margin-bottom:12px;display:block}
    .upload-zone .label{font-size:16px;color:#e5e7eb;margin-bottom:6px}
    .upload-zone .hint{font-size:13px;color:var(--muted)}
    .upload-zone input[type=file]{display:none}
    .upload-progress{margin-top:16px;display:none}
    .upload-progress .bar-bg{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
    .upload-progress .bar{height:100%;background:var(--accent);width:0%;transition:width .3s;border-radius:3px}
    .upload-progress .bar-text{font-size:13px;color:var(--muted);margin-top:6px}
    .upload-result{margin-top:16px;padding:14px 18px;border-radius:8px;font-size:14px;display:none}
    .upload-result.ok{background:#065f46;color:#a7f3d0;border:1px solid #10b981;display:block}
    .upload-result.err{background:#7f1d1d;color:#fecaca;border:1px solid #ef4444;display:block}

    /* Expandable result row */
    .result-panel{display:none;background:var(--input);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px}
    .result-panel.open{display:block}
    .result-text{white-space:pre-wrap;font-size:14px;max-height:400px;overflow:auto;line-height:1.6;background:var(--card);padding:12px;border-radius:6px;margin-top:8px}
    .translation-bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
    .translation-bar button{font-size:12px;padding:4px 10px}
    .translation-result{margin-top:8px;padding:10px;background:var(--card);border-radius:6px;font-size:14px;white-space:pre-wrap;max-height:300px;overflow:auto;display:none}

    /* Spinner */
    .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(56,189,248,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Toast */
    .toast{position:fixed;top:24px;right:24px;padding:14px 20px;border-radius:10px;font-weight:600;font-size:14px;z-index:999;opacity:0;transform:translateY(-10px);transition:all .3s;pointer-events:none}
    .toast.show{opacity:1;transform:translateY(0)}
    .toast-ok{background:#065f46;color:#a7f3d0;border:1px solid #10b981}
    .toast-err{background:#7f1d1d;color:#fecaca;border:1px solid #ef4444}
    .expand-btn{cursor:pointer;background:none;border:0;color:var(--accent);font-size:13px;text-decoration:underline;padding:0}
    .expand-btn:hover{color:#7dd3fc}
  </style>
</head>
<body><main>
  <h1>Transcription Service</h1>
  <div class="nav">
    <a href="/" class="active">Dashboard</a>
    <a href="/models">Models</a>
    <a href="/settings">Settings</a>
  </div>

  <!-- Upload Section -->
  <div class="upload-section">
    <h2>📤 Upload Audio</h2>
    <div class="upload-zone" id="drop-zone">
      <span class="icon">🎵</span>
      <div class="label">Drop audio file here or click to browse</div>
      <div class="hint">MP3, WAV, OGG, M4A, FLAC — up to 500 MB</div>
      <input type="file" id="file-input" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac,.aac,.wma,.opus">
    </div>
    <div class="upload-progress" id="upload-progress">
      <div class="bar-bg"><div class="bar" id="progress-bar"></div></div>
      <div class="bar-text" id="progress-text">Uploading...</div>
    </div>
    <div class="upload-result" id="upload-result"></div>
  </div>

  <!-- Dashboard -->
  <p>Queue observability dashboard. Data refreshes every 10 seconds.</p>
  <div class="btn-bar">
    <button id="refresh">🔄 Refresh</button>
    <button id="clear-queue" class="btn btn-danger">🧹 Clear Stuck Tasks</button>
  </div>
  <div class="summary">
    <div class="card">Total <span class="value" id="total">—</span></div>
    <div class="card">Pending <span class="value" id="pending">—</span></div>
    <div class="card">Completed <span class="value" id="done">—</span></div>
  </div>
  <table><thead><tr>
    <th>Task</th><th>Status</th><th>Created</th><th>Channel</th><th>Actions</th>
  </tr></thead><tbody id="tasks"><tr><td colspan="5">Loading…</td></tr></tbody></table>

  <!-- Toast -->
  <div class="toast" id="toast"></div>
</main><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

function toast(msg,type='ok'){const t=$('toast');t.textContent=msg;t.className='toast toast-'+type+' show';setTimeout(()=>t.classList.remove('show'),4000)}

const LANGUAGES = {en:'English',ru:'Русский',de:'Deutsch',fr:'Français',es:'Español',zh:'中文',ja:'日本語',ko:'한국어',ar:'العربية',pt:'Português',it:'Italiano',tr:'Türkçe',uk:'Українська',hi:'हिन्दी',vi:'Tiếng Việt',th:'ไทย'};

/* ===== Dashboard ===== */
async function load(){
  try{
    const r=await fetch('/task/');
    if(!r.ok)throw Error();
    const d=await r.json(),tasks=d.tasks||[];
    $('total').textContent=d.total;
    $('pending').textContent=tasks.filter(t=>['pending','processing'].includes(t.status)).length;
    $('done').textContent=tasks.filter(t=>t.status==='done').length;
    $('tasks').innerHTML=tasks.slice(0,50).map(t=>{
      const st=t.status||'unknown';
      const ch=t.uid?'OMNINET':t.chat_id?'Telegram':'API';
      const tid=t.task_id;
      const resultText=t.result?esc(t.result):'';
      return `<tr>
        <td><code>${esc(tid).substring(0,12)}…</code></td>
        <td class="status ${esc(st)}">${esc(st)}</td>
        <td>${esc(t.created_at)}</td>
        <td>${ch}</td>
        <td>
          ${st==='done'?`<button class="expand-btn" onclick="toggleResult('${esc(tid)}')">📄 Show result</button>`:''}
          ${['pending','processing'].includes(st)?`<button class="btn-sm btn-danger" onclick="deleteTask('${esc(tid)}')">❌ Cancel</button>`:''}
          ${st==='done'||st==='error'?`<button class="btn-sm btn-outline" onclick="deleteTask('${esc(tid)}')">🗑️</button>`:''}
        </td>
      </tr>
      ${st==='done'?`<tr id="panel-${esc(tid)}" style="display:none"><td colspan="5">
        <div class="result-panel open" id="result-${esc(tid)}">
          <strong>Transcript:</strong>
          <div class="result-text" id="text-${esc(tid)}"><span class="spin"></span> Loading...</div>
          <div class="translation-bar" id="tbar-${esc(tid)}"></div>
          <div class="translation-result" id="tresult-${esc(tid)}"></div>
        </div>
      </td></tr>`:''}`;
    }).join('')||'<tr><td colspan="5">No tasks yet.</td></tr>';
  }catch{$('tasks').innerHTML='<tr><td colspan="5">Could not load task data.</td></tr>'}
}

$('refresh').onclick=load;
load();
setInterval(load,10000);

/* Expand/collapse */
async function toggleResult(taskId){
  const panel=$('panel-'+taskId);
  if(!panel)return;
  if(panel.style.display==='none'){
    panel.style.display='';
    const textEl=$('text-'+taskId);
    try{
      const r=await fetch('/task/'+taskId);
      const d=await r.json();
      textEl.textContent=d.result||'No result';
      // Build translation bar
      const tbar=$('tbar-'+taskId);
      const existing=d.translations||[];
      const existLangs=new Set(existing.map(t=>t.lang));
      let html='<strong>Translate to:</strong> ';
      for(const[code,label]of Object.entries(LANGUAGES)){
        if(existLangs.has(code)){
          html+=`<button class="btn-sm" style="opacity:.5" onclick="showTranslation('${taskId}','${code}')">${label}</button> `;
        }else{
          html+=`<button class="btn-sm btn-outline" onclick="requestTranslation('${taskId}','${code}')">${label}</button> `;
        }
      }
      tbar.innerHTML=html;
      // Auto-show existing translations
      for(const t of existing){
        showTranslation(taskId, t.lang);
      }
    }catch{textEl.textContent='Error loading result'}
  }else{
    panel.style.display='none';
  }
}

async function showTranslation(taskId, lang){
  const tresult=$('tresult-'+taskId);
  tresult.style.display='block';
  tresult.innerHTML=`<span class="spin"></span> Loading ${LANGUAGES[lang]||lang}...`;
  try{
    const r=await fetch(`/translated/${taskId}/${lang}`);
    const d=await r.json();
    tresult.innerHTML=`<strong>${LANGUAGES[lang]||lang}:</strong><br>${esc(d.translated||d.result||'No translation')}`;
  }catch{tresult.textContent='Error loading translation'}
}

async function requestTranslation(taskId, lang){
  const tresult=$('tresult-'+taskId);
  tresult.style.display='block';
  tresult.innerHTML=`<span class="spin"></span> Translating to ${LANGUAGES[lang]||lang}...`;
  try{
    const r=await fetch(`/translated/${taskId}/${lang}`);
    const d=await r.json();
    tresult.innerHTML=`<strong>${LANGUAGES[lang]||lang}:</strong><br>${esc(d.translated||d.result||'No translation')}`;
  }catch{tresult.textContent='Error requesting translation'}
}

/* Clear stuck tasks */
$('clear-queue').onclick=async function(){
  if(!confirm('Clear all stuck pending/processing tasks?'))return;
  try{
    const r=await fetch('/task/clear',{method:'POST'});
    const d=await r.json();
    toast(`Cleared ${d.cleared||0} stuck tasks`,'ok');
    load();
  }catch(e){toast('Error: '+e.message,'err')}
};

/* Delete single task */
async function deleteTask(taskId){
  if(!confirm('Delete this task?'))return;
  try{
    const r=await fetch('/task/'+taskId,{method:'DELETE'});
    const d=await r.json();
    if(d.ok){toast('Task deleted','ok');load();}
    else toast(d.error||'Error','err');
  }catch(e){toast('Error: '+e.message,'err')}
}

/* ===== Upload ===== */
const dropZone=$('drop-zone'), fileInput=$('file-input'), progressDiv=$('upload-progress'),
      progressBar=$('progress-bar'), progressText=$('progress-text'), resultDiv=$('upload-result');

dropZone.onclick=()=>fileInput.click();
dropZone.ondragover=e=>{e.preventDefault();dropZone.classList.add('dragover')};
dropZone.ondragleave=()=>dropZone.classList.remove('dragover');
dropZone.ondrop=e=>{e.preventDefault();dropZone.classList.remove('dragover');if(e.dataTransfer.files.length)uploadFile(e.dataTransfer.files[0])};
fileInput.onchange=()=>{if(fileInput.files.length)uploadFile(fileInput.files[0])};

async function uploadFile(file){
  resultDiv.className='upload-result';resultDiv.style.display='none';
  progressDiv.style.display='block';progressBar.style.width='0%';progressText.textContent=`Uploading ${file.name} (${(file.size/1048576).toFixed(1)} MB)...`;

  const fd=new FormData();fd.append('file',file);
  const xhr=new XMLHttpRequest();
  xhr.upload.onprogress=e=>{if(e.lengthComputable){const pct=Math.round(e.loaded/e.total*100);progressBar.style.width=pct+'%';progressText.textContent=`Uploading ${file.name} — ${pct}%`}};
  xhr.onload=async function(){
    if(xhr.status===202){
      const d=JSON.parse(xhr.responseText);
      progressText.textContent='Upload complete! Task queued.';
      progressBar.style.width='100%';
      resultDiv.className='upload-result ok';
      resultDiv.innerHTML=`✅ Task created: <code>${esc(d.task_id)}</code> — result will appear in the table below.`;
      resultDiv.style.display='block';
      setTimeout(load,2000);
    }else{
      let msg='Upload failed';
      try{msg=JSON.parse(xhr.responseText).error||msg}catch{}
      progressDiv.style.display='none';
      resultDiv.className='upload-result err';
      resultDiv.textContent='❌ '+msg;
      resultDiv.style.display='block';
    }
  };
  xhr.onerror=()=>{
    progressDiv.style.display='none';
    resultDiv.className='upload-result err';
    resultDiv.textContent='❌ Network error during upload';
    resultDiv.style.display='block';
  };
  xhr.open('POST','/transcrib/');xhr.send(fd);
}
</script></body></html>
