services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      RUN_EMBEDDED_WORKER: "false"
      ENABLE_TELEGRAM_BOT: "false"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://transcription:${POSTGRES_PASSWORD:-transcription_dev_password}@postgres:5432/transcription
      DATA_DIRECTORY: /app/data
      MODELS_DIRECTORY: /app/data/models
    ports:
      - "5000:5000"
    volumes:
      - app-data:/app/data
      - models-data:/app/data/models
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        INSTALL_NLLB: ${INSTALL_NLLB:-false}
        INSTALL_QWEN: ${INSTALL_QWEN:-false}
    env_file: .env
    environment:
      RUN_EMBEDDED_WORKER: "false"
      LOAD_LOCAL_MODELS: "true"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://transcription:${POSTGRES_PASSWORD:-transcription_dev_password}@postgres:5432/transcription
      DATA_DIRECTORY: /app/data
      MODELS_DIRECTORY: /app/data/models
    volumes:
      - app-data:/app/data
      - models-data:/app/data/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  bot:
    profiles: [telegram]
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://transcription:${POSTGRES_PASSWORD:-transcription_dev_password}@postgres:5432/transcription
      DATA_DIRECTORY: /app/data
      TELEGRAM_LOCAL_SERVER: http://telegram-bot-api:8081
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started

  telegram-bot-api:
    profiles: [telegram]
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5

  miniapp-gateway:
    profiles: [telegram]
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:5050:8080"
    volumes:
      - ./nginx/miniapp.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transcription
      POSTGRES_USER: transcription
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcription_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcription -d transcription"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  app-data:
  models-data:
  redis-data:
  postgres-data:
  telegram-bot-api-data:
